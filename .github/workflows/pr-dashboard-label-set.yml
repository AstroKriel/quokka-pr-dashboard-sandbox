name: 🏷️ PR Dashboard Label Set

on:
  push:
    branches:
      - development
    paths:
      - .github/pr_dashboard/labels.toml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          sparse-checkout: .github/pr_dashboard
          persist-credentials: false

      - name: Create and update the labels in labels.toml
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PYTHONPATH: .github/pr_dashboard/src
        run: python3 -m pr_dashboard.run_dashboard sync-label-set --repo "$REPO"
