# The labels used by the PR dashboard. Labels not listed here are left alone.
#
# scope/ labels are set from the changed files: a PR gets every scope with a matching path.
# A pattern's `*` also matches `/`, so `src/hydro/*` covers every file below `src/hydro/`.
# size/ labels are set from the lines changed (additions plus deletions): a PR gets the
# largest `min_num_lines` it reaches.
# scope/ and size/ labels are set by the tool; edits by hand are replaced.

default_priority = "priority/medium"

[scope_fallback]
label = "scope/tests"
paths = ["src/problems/*", "inputs/*", "extern/*"]

[[scope_label]]
name = "scope/hydro"
color = "4ADD08"
description = "Hydrodynamics"
paths = [
    "src/hydro/*",
    "src/turbulence/*",
    "src/problems/Hydro*",
    "src/problems/Nscbc*",
    "inputs/Hydro*",
    "inputs/Nscbc*",
]

[[scope_label]]
name = "scope/MHD"
color = "66735C"
description = "Magnetohydrodynamics"
paths = [
    "src/hydro/mhd_system*",
    "src/hydro/HLLD*",
    "src/hydro/LLF_mhd*",
    "src/problems/MHD*",
    "src/problems/IsothermalMHD*",
    "src/problems/OrszagTang*",
    "src/problems/FieldLoop*",
    "src/problems/CurrentSheet*",
    "inputs/MHD*",
    "inputs/IsothermalMHD*",
    "inputs/OrszagTang*",
    "inputs/FieldLoop*",
    "inputs/CurrentSheet*",
    "inputs/alfven_wave*",
]

[[scope_label]]
name = "scope/radiation"
color = "CAD629"
description = "Radiation transport"
paths = [
    "src/radiation/*",
    "src/problems/Rad*",
    "src/problems/Stromgren*",
    "inputs/Rad*",
    "inputs/Stromgren*",
]

[[scope_label]]
name = "scope/particles"
color = "277120"
description = "Particles"
paths = [
    "src/particles/*",
    "src/problems/Particle*",
    "src/problems/BinaryOrbit*",
    "src/problems/GravRadParticle*",
    "src/problems/InitialStellarParticles*",
    "inputs/Particle*",
    "inputs/BinaryOrbit*",
    "inputs/GravRadParticle*",
]

[[scope_label]]
name = "scope/chemistry"
color = "C5DEF5"
description = "Chemistry and chemical networks"
paths = [
    "src/chemistry/*",
    "src/networks/*",
    "src/microphysics/*",
    "src/problems/PrimordialChem*",
    "src/problems/PopIII*",
    "inputs/PrimordialChem*",
    "inputs/PopIII*",
]

[[scope_label]]
name = "scope/cooling"
color = "BFD4F2"
description = "Radiative cooling"
paths = ["src/cooling/*", "src/problems/ResampledCooling*", "inputs/ResampledCooling*"]

[[scope_label]]
name = "scope/dust"
color = "D4C5F9"
description = "Dust"
paths = [
    "src/dust/*",
    "src/problems/Dust*",
    "src/problems/RadDust*",
    "src/problems/RadMarshakDust*",
    "inputs/Dust*",
    "inputs/RadDust*",
    "inputs/RadMarshakDust*",
]

[[scope_label]]
name = "scope/conduction"
color = "F9D0C4"
description = "Thermal conduction"
paths = ["src/conduction/*", "src/problems/ThermalConduction*", "inputs/ThermalConduction*"]

[[scope_label]]
name = "scope/IO"
color = "1D76DB"
description = "Input and output"
paths = ["src/io/*"]

[[scope_label]]
name = "scope/core"
color = "5319E7"
description = "The shared driver, math and utilities"
paths = [
    "src/QuokkaSimulation*",
    "src/simulation*",
    "src/hyperbolic_system*",
    "src/physics_info*",
    "src/physics_numVars*",
    "src/math/*",
    "src/util/*",
    "src/main*",
    "src/grid*",
    "src/SimulationData*",
    "src/Factory*",
    "src/linear_advection/*",
]

[[scope_label]]
name = "scope/build"
color = "C2E0C6"
description = "The build system and third-party libraries"
paths = [
    "CMakeLists.txt",
    "src/CMakeLists.txt",
    "*.cmake",
    ".gitmodules",
    ".gitignore",
    "extern/amrex*",
    "extern/AMReX-Hydro*",
    "extern/Microphysics*",
    "extern/openPMD-api*",
]

[[scope_label]]
name = "scope/tests"
color = "FEF2C0"
description = "Test problems, inputs, reference data and the regression suite"
paths = ["regression/*", "tests/*"]

[[scope_label]]
name = "scope/tools"
color = "E99695"
description = "Helper scripts and files for AI agents"
paths = ["scripts/*", ".agents/*", ".claude/*", "AGENTS.md", "CLAUDE.md", "context7.json"]

[[scope_label]]
name = "scope/CI"
color = "BFDADC"
description = "Continuous integration and code checkers"
paths = [
    ".github/*",
    ".ci/*",
    ".devcontainer/*",
    ".dockerignore",
    ".pre-commit-config.yaml",
    ".codespellrc",
    ".codespell-ignore-words",
    ".sonarcloud.properties",
    "run-codeql.sh",
    "src/.clang-format",
    "src/.clang-tidy",
    "src/CPPLINT.cfg",
]

[[scope_label]]
name = "scope/documentation"
color = "0075CA"
description = "Documentation"
paths = ["docs/*", "*.md", "paper/*", "CITATION.cff", "LICENSE", ".mailmap"]

[[size_label]]
name = "size/XS"
color = "00FF00"
description = "This PR changes 0 to 9 lines"
min_num_lines =0

[[size_label]]
name = "size/S"
color = "77B800"
description = "This PR changes 10 to 29 lines"
min_num_lines =10

[[size_label]]
name = "size/M"
color = "EBB800"
description = "This PR changes 30 to 99 lines"
min_num_lines =30

[[size_label]]
name = "size/L"
color = "EB9500"
description = "This PR changes 100 to 499 lines"
min_num_lines =100

[[size_label]]
name = "size/XL"
color = "FF823F"
description = "This PR changes 500 or more lines"
min_num_lines =500

[[priority_label]]
name = "priority/low"
color = "0E8A16"
description = "Review when there is time"

[[priority_label]]
name = "priority/medium"
color = "FBCA04"
description = "Review at the normal pace"

[[priority_label]]
name = "priority/high"
color = "D93F0B"
description = "Review soon"
