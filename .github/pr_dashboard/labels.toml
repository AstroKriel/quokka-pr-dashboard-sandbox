## --- framework

[[scope.label]]
name = "IO"
color = "1D76DB"
description = "Input and output"
paths = ["src/io/*"]

[[scope.label]]
name = "core"
color = "5319E7"
description = "The shared driver, math and utilities"
paths = [
    "src/QuokkaSimulation*",
    "src/simulation*",
    "src/hyperbolic_system*",
    "src/physics_info*",
    "src/physics_numVars*",
    "src/math/*",
    "src/util/*",
    "src/main*",
    "src/grid*",
    "src/SimulationData*",
    "src/Factory*",
    "src/linear_advection/*",
]

## --- build, tests and tooling

[[scope.label]]
name = "build"
color = "C2E0C6"
description = "The build system and third-party libraries"
paths = [
    "CMakeLists.txt",
    "src/CMakeLists.txt",
    "*.cmake",
    ".gitmodules",
    ".gitignore",
    "extern/amrex*",
    "extern/AMReX-Hydro*",
    "extern/Microphysics*",
    "extern/openPMD-api*",
]

[[scope.label]]
name = "tests"
color = "FEF2C0"
description = "Test problems, inputs, reference data and the regression suite"
paths = ["src/problems/*", "inputs/*", "extern/*", "regression/*", "tests/*"]

[[scope.label]]
name = "tools"
color = "E99695"
description = "Helper scripts and files for AI agents"
paths = ["scripts/*", ".agents/*", ".claude/*", "AGENTS.md", "CLAUDE.md", "context7.json"]

[[scope.label]]
name = "CI"
color = "BFDADC"
description = "Continuous integration and code checkers"
paths = [
    ".github/*",
    ".ci/*",
    ".devcontainer/*",
    ".dockerignore",
    ".pre-commit-config.yaml",
    ".codespellrc",
    ".codespell-ignore-words",
    ".sonarcloud.properties",
    "run-codeql.sh",
    "src/.clang-format",
    "src/.clang-tidy",
    "src/CPPLINT.cfg",
]

## --- documentation

[[scope.label]]
name = "documentation"
color = "0075CA"
description = "Documentation"
paths = ["docs/*", "*.md", "paper/*", "CITATION.cff", "LICENSE", ".mailmap"]

##
## === SIZE LABELS
##

## set from the lines changed (additions plus deletions): a PR gets the largest
## `min_num_lines` it reaches

[size]
prefix = "size/"

[[size.label]]
name = "XS"
color = "00FF00"
description = "This PR changes 0 to 9 lines"
min_num_lines = 0

[[size.label]]
name = "S"
color = "77B800"
description = "This PR changes 10 to 29 lines"
min_num_lines = 10

[[size.label]]
name = "M"
color = "EBB800"
description = "This PR changes 30 to 99 lines"
min_num_lines = 30

[[size.label]]
name = "L"
color = "EB9500"
description = "This PR changes 100 to 499 lines"
min_num_lines = 100

[[size.label]]
name = "XL"
color = "FF823F"
description = "This PR changes 500 or more lines"
min_num_lines = 500

##
## === PRIORITY LABELS
##

## set by people with /set-priority, using the name, e.g. `/set-priority high`
## the one marked `default = true` is given to a PR that has no priority label

[priority]
prefix = "priority/"

[[priority.label]]
name = "low"
color = "0E8A16"
description = "Review when there is time"

[[priority.label]]
name = "medium"
color = "FBCA04"
description = "Review at the normal pace"
default = true

[[priority.label]]
name = "high"
color = "D93F0B"
description = "Review soon"
