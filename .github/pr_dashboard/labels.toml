## the labels used by the PR dashboard; labels not listed here are left alone
## each category sets a prefix, and each label's full name is the prefix plus its name
## scope/ and size/ labels are set by the tool; edits by hand are replaced

##
## === SCOPE LABELS
##

## set from the changed files: a PR gets every scope with a matching path
## a pattern's `*` also matches `/`, so `src/hydro/*` covers every file below `src/hydro/`

[scope]
prefix = "scope/"

## --- unmapped files
## a changed file that matches no scope gives the PR this label, to show that its path
## needs adding to a scope below
[scope.not_mapped_label]
name = "not_mapped"
color = "B60205"
description = "A changed file matches no scope in labels.toml"

## --- physics
## each module's src/ folder, its problems in src/problems/, and their files in inputs/

[[scope.label]]
name = "hydro"
color = "4ADD08"
description = "Hydrodynamics"
paths = [
    "src/hydro/*",
    "src/turbulence/*",
    "src/problems/Hydro*",
    "src/problems/Nscbc*",
    "inputs/Hydro*",
    "inputs/Nscbc*",
]

